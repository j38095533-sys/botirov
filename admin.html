<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Пульт сайта — Азизбек Ботиров</title>
<meta name="theme-color" content="#03070b">
<link rel="manifest" href="admin.webmanifest">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/admin-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Пульт">
<link rel="stylesheet" href="fonts.css">
<style>
  :root { --bg: #05090d; --card: #0d151c; --card2: #121d26; --ink: #ecf7f9; --mute: rgba(236, 247, 249, .62); --line: rgba(255, 255, 255, .1); --acc: #2ee6ff; --ok: #3ddc84; --bad: #ff5a6a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: Manrope, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body { min-height: 100svh; padding: 0 16px calc(24px + env(safe-area-inset-bottom)); }
  button, input { font: inherit; color: inherit; }
  .top { max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: calc(16px + env(safe-area-inset-top)) 0 16px; border-bottom: 1px solid var(--line); }
  .top b { display: block; font-size: 18px; font-weight: 800; letter-spacing: -.02em; }
  .top span { font-size: 12.5px; color: var(--mute); }
  .top a { color: var(--acc); text-decoration: none; font-size: 14px; font-weight: 600; white-space: nowrap; }

  /* вход */
  .lock { min-height: 70svh; display: grid; place-items: center; }
  .lock[hidden], .panel[hidden] { display: none; }
  .lock-card { width: min(380px, 100%); padding: 28px 22px 22px; border-radius: 24px; background: var(--card); border: 1px solid var(--line); text-align: center; }
  .lock-ic { width: 56px; height: 56px; margin: 0 auto 14px; border-radius: 18px; display: grid; place-items: center; background: rgba(46, 230, 255, .12); color: var(--acc); }
  .lock-ic svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .lock h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: -.02em; }
  .lock p { margin: 0 0 18px; font-size: 14px; color: var(--mute); }
  .lock input[type=password] { width: 100%; height: 52px; padding: 0 16px; border-radius: 14px; border: 1px solid var(--line); background: #070c11; font-size: 17px; outline: none; }
  .lock input[type=password]:focus { border-color: var(--acc); }
  .lock label { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 14px 0; font-size: 14px; color: var(--mute); }
  .lock label input { width: 18px; height: 18px; accent-color: var(--acc); }
  .btn { width: 100%; height: 52px; border: 0; border-radius: 14px; background: var(--acc); color: #03070b; font-weight: 800; font-size: 16px; cursor: pointer; }
  .btn:disabled { opacity: .45; cursor: default; }
  .err { min-height: 20px; margin: 12px 0 0 !important; color: var(--bad) !important; font-weight: 600; }

  /* панель */
  .panel { max-width: 1100px; margin: 0 auto; }
  .status { display: flex; align-items: center; gap: 10px; margin: 16px 0; padding: 12px 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); font-size: 14.5px; }
  .status .dot { width: 9px; height: 9px; border-radius: 50%; background: #8a99a0; flex: none; }
  .status.ok .dot { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
  .status.bad .dot { background: var(--bad); }
  .layout { display: grid; gap: 18px; }
  .preview { display: grid; justify-items: center; gap: 8px; }
  .phone { position: relative; width: 236px; height: calc(236px * 844 / 390); border-radius: 30px; overflow: hidden; background: #000; border: 6px solid #1b252d; box-shadow: 0 20px 60px -20px rgba(46, 230, 255, .35); }
  .phone iframe { position: absolute; left: 0; top: 0; width: 390px; height: 844px; border: 0; transform-origin: 0 0; transform: scale(calc(224 / 390)); }
  .pv-cap { margin: 0; font-size: 13px; color: var(--mute); text-align: center; }
  h2 { margin: 4px 0 12px; font-size: 18px; letter-spacing: -.01em; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .card { position: relative; padding: 0; border-radius: 16px; overflow: hidden; background: var(--card2); border: 2px solid transparent; text-align: left; cursor: pointer; transition: border-color .2s, transform .15s; }
  .card:active { transform: scale(.98); }
  .card img { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; object-position: top; background: #0a1016; }
  .card .t { display: block; padding: 9px 10px 2px; font-size: 13.5px; font-weight: 700; line-height: 1.2; }
  .card .d { display: block; padding: 0 10px 10px; font-size: 11.5px; color: var(--mute); line-height: 1.3; }
  .card.sel { border-color: var(--acc); }
  .card .badge { position: absolute; top: 8px; left: 8px; padding: 4px 8px; border-radius: 999px; background: var(--ok); color: #03140a; font-size: 11px; font-weight: 800; display: none; }
  .card.live .badge { display: block; }
  .apply-bar { position: sticky; bottom: 0; padding: 12px 0 calc(4px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 70%, transparent); margin-top: 14px; }
  .note { margin: 8px 0 0; font-size: 12.5px; color: var(--mute); text-align: center; }
  .logout { display: block; margin: 22px auto 0; background: none; border: 0; color: var(--mute); text-decoration: underline; font-size: 13px; cursor: pointer; }
  .toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); opacity: 0; z-index: 9;
    padding: 12px 16px; border-radius: 14px; background: #ecf7f9; color: #03070b; font-weight: 700; font-size: 14px; text-align: center; width: max-content; max-width: calc(100% - 32px);
    transition: opacity .3s, transform .3s; pointer-events: none; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  .toast.bad { background: var(--bad); color: #fff; }
  @media (min-width: 860px) {
    .layout { grid-template-columns: 300px 1fr; align-items: start; gap: 32px; }
    .preview { position: sticky; top: 16px; }
    .phone { width: 290px; height: calc(290px * 844 / 390); }
    .phone iframe { transform: scale(calc(278 / 390)); }
    .grid { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>
<header class="top">
  <div><b>Пульт сайта</b><span>Азизбек Ботиров · визитка</span></div>
  <a href="./" target="_blank" rel="noopener">Открыть сайт ↗</a>
</header>

<section class="lock" id="lock">
  <div class="lock-card">
    <div class="lock-ic"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></div>
    <h1>Вход для врача</h1>
    <p>Здесь меняется фон сайта-визитки</p>
    <form id="lockform" autocomplete="on">
      <input type="text" name="username" value="doctor" autocomplete="username" hidden>
      <input id="pw" type="password" autocomplete="current-password" placeholder="Пароль" required>
      <label><input type="checkbox" id="remember" checked> Запомнить на этом устройстве</label>
      <button class="btn" id="enter">Войти</button>
      <p class="err" id="err"></p>
    </form>
  </div>
</section>

<section class="panel" id="panel" hidden>
  <div class="status" id="statusbox"><span class="dot"></span><span id="status">Проверяю, что сейчас на сайте…</span></div>
  <div class="layout">
    <div class="preview">
      <div class="phone"><iframe id="frame" title="Как будет выглядеть сайт" src="about:blank" loading="lazy"></iframe></div>
      <p class="pv-cap" id="pvcap">Так сайт выглядит на телефоне</p>
    </div>
    <div>
      <h2>Выберите фон</h2>
      <div class="grid" id="grid"></div>
      <div class="apply-bar">
        <button class="btn" id="apply" disabled>Поставить на сайт</button>
        <p class="note">Посетители увидят новый фон сразу — ничего обновлять не нужно</p>
      </div>
      <button class="logout" id="logout">Выйти на этом устройстве</button>
    </div>
  </div>
</section>
<div class="toast" id="toast" role="status"></div>
<script type="module" src="admin.js?v=4"></script>
</body>
</html>
